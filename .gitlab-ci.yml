stages:
  - test
  - docs

variables:
  # No GPU on CI runners: force Mesa's software rasteriser (llvmpipe).
  LIBGL_ALWAYS_SOFTWARE: "1"
  # Let Pkg use the system git client (more robust than libgit2 behind proxies).
  JULIA_PKG_USE_CLI_GIT: "true"

# Shared setup: a modern Julia plus a headless OpenGL stack (Mesa + Xvfb) so GLMakie can
# initialise, and the KM3NeT Julia registry. This mirrors the Dockerfile; to skip the
# per-job apt-get, build that image and point `image:` at it instead.
.headless_julia: &headless_julia
  image: julia:1.11-bookworm
  before_script:
    - apt-get -qq update
    - |
      DEBIAN_FRONTEND=noninteractive apt-get -y install --no-install-recommends \
        git ca-certificates openssh-client xvfb xauth \
        libgl1 libglx-mesa0 libgl1-mesa-dri libglu1-mesa \
        libxrandr2 libxinerama1 libxcursor1 libxi6 libxext6 \
        libx11-6 libxrender1 libxfixes3 libxxf86vm1 libfontconfig1 libfreetype6
    - mkdir -p /root/.ssh && ssh-keyscan -H -t rsa git.km3net.de >> /root/.ssh/known_hosts
    - |
      julia -e '
        using Pkg
        Pkg.Registry.add("General")
        Pkg.Registry.add(RegistrySpec(url = "https://git.km3net.de/common/julia-registry"))'

test:
  <<: *headless_julia
  stage: test
  coverage: '/Test coverage (\d+\.\d+%)/'
  script:
    # xvfb-run provides a virtual X display so GLMakie/GLFW can create a GL context.
    - |
      xvfb-run -a julia --project=@. -e '
        using Pkg
        Pkg.build()
        Pkg.test(coverage = true)'
  after_script:
    - |
      julia -e '
        using Pkg
        Pkg.Registry.add(RegistrySpec(url = "https://git.km3net.de/common/julia-registry"))
        Pkg.add("Coverage")
        using Coverage
        c, t = get_summary(process_folder())
        using Printf
        @printf "Test coverage %.2f%%\n" 100c / t'

docs:
  <<: *headless_julia
  stage: docs
  script:
    - |
      xvfb-run -a julia --project=docs -e '
        using Pkg
        Pkg.develop(PackageSpec(path = pwd()))
        Pkg.instantiate()
        using Documenter: doctest
        using RainbowAlga
        doctest(RainbowAlga)
        include("docs/make.jl")'
